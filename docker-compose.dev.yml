name: lavaliente-dev

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: poetry run fastapi dev src/main.py --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lavaliente}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lavaliente}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY}
      ENVIRONMENT: development
      # Escaneo de boleta (Plan 0003). Sin key el módulo se queda apagado y la
      # captura a mano sigue entera (D8), así que no lleva `:?`: un despliegue
      # sin Gemini es un despliegue válido.
      SCAN_ENABLED: ${SCAN_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SCAN_MODEL: ${SCAN_MODEL:-gemini-2.5-flash}
      SCAN_STORAGE_PATH: ${SCAN_STORAGE_PATH:-./media/scans}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lavaliente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lavaliente}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
